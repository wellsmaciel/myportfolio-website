name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HTML
        run: npx --yes html-validate@9 --config .github/html-validate.json index.html

      # Offline: only local files (images, css, js) and #anchors, so external sites can't break the build
      - name: Check local links and assets
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments --no-progress index.html
          fail: true

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css main.js Images LICENSE _site/
          # Pages caches assets for 10 min; a per-commit query makes browsers fetch new CSS/JS with the new HTML
          sed -i "s#href=\"style.css\"#href=\"style.css?v=${GITHUB_SHA::7}\"#; s#src=\"main.js\"#src=\"main.js?v=${GITHUB_SHA::7}\"#" _site/index.html
          grep -q "style.css?v=" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
